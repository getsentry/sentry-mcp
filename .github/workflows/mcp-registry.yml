name: Publish MCP Registry

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Existing stable GitHub/npm release to publish (e.g. 0.40.0)
        required: true
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: mcp-registry-${{ inputs.version || github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.repository == 'getsentry/sentry-mcp' &&
      ((github.event_name == 'release' && !github.event.release.prerelease) ||
       (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ inputs.version || github.event.release.tag_name }}
    steps:
      # Use maintained release tooling, including for tags predating this workflow.
      # Never execute the selected release's code in this OIDC-enabled job.
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check stable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module -e 'import {createManifest} from "./scripts/mcp-registry.mjs"; createManifest({packages: []}, process.env.VERSION)'
          gh release view "$VERSION" --repo getsentry/sentry-mcp --json tagName,isDraft,isPrerelease \
            | jq -e --arg version "$VERSION" '.tagName == $version and (.isDraft | not) and (.isPrerelease | not)'

      # Craft's GitHub target precedes npm. Do not publish metadata until the
      # exact npm version exists and its mcpName matches. Bounded wait: 10 min.
      - name: Wait for npm and prepare registry metadata
        id: prepare
        run: node scripts/mcp-registry.mjs prepare "$VERSION" "$RUNNER_TEMP/server.json"

      - name: Install pinned MCP publisher
        if: steps.prepare.outputs.publish == 'true'
        working-directory: ${{ runner.temp }}
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz \
            -o mcp-publisher.tar.gz
          echo 'a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc  mcp-publisher.tar.gz' | sha256sum --check
          tar xzf mcp-publisher.tar.gz mcp-publisher

      - name: Publish registry metadata
        if: steps.prepare.outputs.publish == 'true'
        working-directory: ${{ runner.temp }}
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish

      - name: Verify published registry metadata
        run: node scripts/mcp-registry.mjs verify "$VERSION"
